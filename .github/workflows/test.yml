# SPDX-License-Identifier: Apache-2.0
#
# The public repository's CI, and the run behind the README's tests badge. The
# framework's source repository keeps a longer private workflow of its own; this
# file is what the export publishes in its place as .github/workflows/test.yml, so
# the badge is backed by a run of the tree a reader can see.
#
# It runs the same sharded hook suite on GitHub-hosted runners only: Linux under
# the distribution's awk and again under GNU awk, and macOS under bash 3.2 and the
# BWK awk, which is where portability breaks show up first; and the platform smoke
# on Windows under Git Bash. Nothing here installs
# by piping a download into a shell, and no step reports success for work it did
# not do: a step that does not apply to a platform is left out by its `if`, and a
# tool that cannot be installed fails the job.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    name: hook suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Ensure jq is present
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew install jq
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Report the bash and awk versions under test
        run: |
          bash --version | head -n 1
          printf 'awk: %s\n' "$(awk --version 2>&1 | head -n 1 || awk -W version 2>&1 | head -n 1)"

      - name: Shellcheck the stamped hooks and scripts
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          command -v shellcheck >/dev/null 2>&1 || { echo "::error::shellcheck could not be installed"; exit 1; }
          shellcheck -S warning templates/hooks/*.sh scripts/*.sh \
            templates/git-hooks/setlist-hook-lib.sh \
            templates/git-hooks/pre-commit templates/git-hooks/pre-merge-commit \
            templates/git-hooks/pre-push

      - name: Run the hook suite (sharded)
        run: bash test/run-shards.sh

      - name: Run the hook suite under GNU awk
        if: runner.os == 'Linux'
        run: |
          if ! command -v gawk >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gawk
          fi
          command -v gawk >/dev/null 2>&1 || { echo "::error::gawk could not be installed"; exit 1; }
          SHIM="$(mktemp -d)"
          ln -sf "$(command -v gawk)" "$SHIM/awk"
          export PATH="$SHIM:$PATH"
          case "$(awk --version 2>&1 | head -n 1)" in
            *"GNU Awk"*) ;;
            *) echo "::error::the shim did not take: awk on PATH is not GNU awk"; exit 1 ;;
          esac
          bash test/run-shards.sh

  # WINDOWS 11 UNDER GIT BASH (spec 0179): the platform smoke, the regions whose
  # marker carries a smoke= trait (path spelling, CRLF, symlinks, awk and sed
  # differences, mktemp, the fixture bins, POSIX permissions), on a hosted Windows
  # runner. The full suite runs there too slowly to be a per-push check, so the
  # smoke is what this badge's run covers on Windows. The steps are the source
  # repository's own smoke job's, byte for byte: Git for Windows' bash first on the
  # job's PATH (a Windows runner's `bash` can otherwise resolve to WSL's launcher),
  # line endings kept LF before the checkout, and the native Windows jq.
  windows-smoke:
    name: platform smoke (windows-latest, Git Bash)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict
    steps:
      # BASH THROUGH THE JOB'S PATH. The runner resolves `shell: bash` by PATH plus
      # this job's GITHUB_PATH prepend, and a path under "Program Files" cannot be
      # spelled in `shell:`, so this step finds the Git installation from wherever git
      # resolves and prepends its bin directory to this job alone. It also points
      # GIT_CONFIG_GLOBAL at a file in the job's temp directory, so the one global
      # setting below (autocrlf, before the checkout) stays inside the job.
      - name: Put Git for Windows' bash on this job's PATH
        shell: powershell
        run: |
          $git = (Get-Command git).Source
          $bin = Join-Path (Split-Path (Split-Path $git -Parent) -Parent) 'bin'
          if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { throw "no bash.exe beside git at $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "GIT_CONFIG_GLOBAL=$env:RUNNER_TEMP\setlist-gitconfig"
          Write-Output "bash: $bin\bash.exe; GIT_CONFIG_GLOBAL: $env:RUNNER_TEMP\setlist-gitconfig"

      - name: Check out with LF line endings (no autocrlf)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Ensure jq is present
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            choco install jq -y --no-progress
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi
          jq --version

      - name: Run the platform smoke, sharded one per core and timed
        env:
          SETLIST_SUITE_TIMES: "1"
        run: |
          set -o pipefail
          printf 'runner cores: %s\n' "$(nproc 2>/dev/null || echo unknown)"
          bash test/run-tests.sh --list-regions --smoke | sed 's/^/smoke member: /'
          n="$(nproc 2>/dev/null || echo 2)"; [ "$n" -ge 1 ] 2>/dev/null || n=2
          bash test/run-shards.sh --smoke --shards "$n" 2>&1 | tee smoke-windows.log
