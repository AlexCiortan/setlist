name: tests

on:
  push:
  pull_request:

jobs:
  hooks:
    name: hook suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One matrix, two bindings, because publish-setlist.sh copies .github wholesale
        # and this file has to stay correct in BOTH repos.
        #
        # Public Setlist: standard runners are unmetered there, so both legs run
        # GitHub-hosted. The macOS leg is not redundant: it runs bash 3.2 and the BSD
        # userland, which is where portability breaks show up first.
        #
        # This private source repo: the Free allowance for private repos is spent, and
        # macOS bills at roughly 10x, so the suite runs on the self-hosted runner and the
        # macOS leg is left to public, which covers it at no cost.
        #
        # The expression lives here, in the matrix, and NOT in a job-level `if`: the
        # matrix context is unavailable to `if`, so a condition on matrix.os there reads
        # as empty and silently skips every leg, reporting green having run nothing.
        # Do not hardcode self-hosted either. The public repo has no such runner, so the
        # job would queue forever and hang the README badge.
        os: ${{ github.repository == 'AlexCiortan/setlist'
              && fromJSON('["ubuntu-latest","macos-latest"]')
              || fromJSON('["self-hosted"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Ensure jq is present
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew install jq
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Report the bash version under test
        run: bash --version | head -n 1

      - name: Run the hook suite
        run: bash test/run-tests.sh

      # The three private legs. dogfood/ is NOT exported, so these files exist
      # only in the source repo, and this workflow is copied wholesale into the
      # public one. The guard is FILE EXISTENCE rather than a repository-name
      # expression, deliberately: the matrix comment above records that a
      # condition evaluated in the wrong context reads as empty and silently
      # skips every leg while reporting green. A file test cannot do that.
      #
      # And when they are absent the step SAYS SO. A skip nobody can see is the
      # same defect as a check that cannot fail, which is what left
      # macos-equiv.sh unable to fail for two days: no step obliged anyone to
      # run it and nothing announced that it had not run.
      - name: Hook smoke (private; the harness dispatch path)
        run: |
          if [ -f dogfood/hook-smoke.sh ]; then
            bash dogfood/hook-smoke.sh
          else
            echo "SKIPPED: dogfood/hook-smoke.sh is absent, which is expected in the public repo (dogfood/ is not exported)."
          fi

      - name: Outcome oracle (private; gate decision vs observed reality)
        run: |
          if [ -f dogfood/oracle-diff.sh ]; then
            # Bounded rather than --all: the full corpus is about eleven minutes
            # and the sample is a stride over every dimension, not a prefix, so
            # a bounded run still crosses the whole space.
            bash dogfood/oracle-diff.sh --gate both --cases 300
          else
            echo "SKIPPED: dogfood/oracle-diff.sh is absent, which is expected in the public repo (dogfood/ is not exported)."
          fi

      - name: Mutation check (private; does the suite notice a broken gate?)
        run: |
          if [ -f dogfood/mutation-check.sh ]; then
            bash dogfood/mutation-check.sh
          else
            echo "SKIPPED: dogfood/mutation-check.sh is absent, which is expected in the public repo (dogfood/ is not exported)."
          fi
